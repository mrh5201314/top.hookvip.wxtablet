# sync-upstream.yml
# Settings → Secrets and variables → Actions → Secrets设置GH_PAT
# Settings → Secrets and variables → Actions → Variables设置UPSTREAM_REPO
name: 同步所有上游分支与标签

on:
  # 通过定时执行
  schedule:
     # 每天北京时间上午8点（UTC 0点）触发
    - cron: '0 0 * * *'
  # 通过手动执行
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库地址（HTTPS URL）'
        required: false
        default: ''
      upstream_branch_pattern:
        description: '要同步的分支正则（例如 .* 匹配全部，^main$ 仅主分支）'
        required: false
        default: '.*'

env:
  # 从仓库 Variables 读取默认值（若未设置则使用硬编码示例）
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
  # 消除剩余Node版本弃用警告
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送代码和标签

    steps:
      - name: 检出仓库代码（含所有历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: 配置 Git 环境
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: 添加或更新 upstream 远程地址
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream ${{ github.event.inputs.upstream_repo || env.UPSTREAM_REPO }}

      # ---- 获取上游分支列表（带 --prune 清理已删除分支） ----
      - name: 获取上游分支列表（清理已删除分支）
        id: fetch
        run: |
          echo "🔄 执行 git fetch upstream --prune --no-tags --verbose ..."
          git fetch upstream --prune --no-tags --verbose
          echo "📋 所有远程分支（upstream/ 前缀）："
          git branch -r | grep 'upstream/' || echo "（无）"
          branches=$(git branch -r \
            | grep 'upstream/' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/upstream\///' \
            | grep -v 'HEAD' \
            | grep -E "${{ github.event.inputs.upstream_branch_pattern || '.*' }}" || true)
          echo "📌 最终分支列表（共 $(echo "$branches" | wc -l) 个）："
          echo "$branches"
          echo "branch_list<<EOF" >> $GITHUB_OUTPUT
          echo "$branches" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ---- 拉取所有 tags（用于后续推送和获取注解） ----
      # 当有重名标签时，需要添加 --force，不然会报错。
      - name: 拉取上游所有 tags
        run: git fetch upstream --tags

      # ---- 检查是否首次初始化 ----
      - name: 检查远程仓库是否已初始化
        id: check_init
        run: |
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/upstream/HEAD | sed 's@^refs/remotes/upstream/@@')
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          if git ls-remote origin "$DEFAULT_BRANCH" | grep -q "refs/heads/$DEFAULT_BRANCH"; then
            echo "need_mirror=false" >> $GITHUB_OUTPUT
          else
            echo "need_mirror=true" >> $GITHUB_OUTPUT
          fi

      # ---- 首次初始化（镜像推送） ----
      - name: 首次初始化 – 镜像推送所有分支和标签（强制覆盖）
        if: steps.check_init.outputs.need_mirror == 'true'
        run: |
          echo "🚀 首次镜像推送..."
          git push origin +refs/remotes/upstream/*:refs/heads/* --force
          git push origin --tags --force
          echo "✅ 镜像完成"

      # ---- 增量合并每个分支（带引用验证，避免因引用缺失而报错） ----
      - name: 增量合并每个分支（自动合并，冲突则跳过）
        if: steps.check_init.outputs.need_mirror == 'false'
        run: |
          BRANCHES="${{ steps.fetch.outputs.branch_list }}"
          IFS=$'\n'
          for branch in $BRANCHES; do
            [ -z "$branch" ] && continue
            echo "=== 正在处理分支: $branch ==="
            # 清理工作区
            git reset --hard HEAD
            git clean -fd

            # 验证上游引用是否存在
            if ! git rev-parse --verify "refs/remotes/upstream/$branch" >/dev/null 2>&1; then
              echo "⚠️ 上游引用 refs/remotes/upstream/$branch 不存在，跳过"
              continue
            fi

            # 强制创建或重置本地分支到上游引用（-B 即使分支已存在也重置）
            git checkout -f -B "$branch" "refs/remotes/upstream/$branch"
            # 将本地分支重置为 origin 上的最新状态（确保与远程 origin 同步）
            git fetch origin "$branch" 2>/dev/null || true
            git reset --hard "origin/$branch" 2>/dev/null || true

            BEFORE_SHA=$(git rev-parse HEAD)

            # 尝试合并 upstream 分支（强制创建合并提交，不自动提交；允许无关历史；接受上游版本）
            if git merge --no-commit --no-ff "refs/remotes/upstream/$branch" -X theirs --allow-unrelated-histories; then
              if git diff --cached --quiet; then
                echo "ℹ️  $branch 无新提交"
              else
                git commit -m "Merge upstream/$branch [skip ci]"
                AFTER_SHA=$(git rev-parse HEAD)
                COUNT=$(git log --oneline "${BEFORE_SHA}..${AFTER_SHA}" | wc -l)
                echo "✅ $branch 已更新，共 $COUNT 个提交"
              fi
              # 推送分支（此时必定是 fast-forward）
              #git push origin "$branch"
              # 避免有branch和tags同名的情况
              git push origin refs/heads/"$branch":refs/heads/"$branch"
            else
              echo "❌ $branch 合并失败，已跳过"
              if [ -f .git/MERGE_HEAD ]; then
                git merge --abort
              fi
            fi
          done
          unset IFS

      # ---- 推送所有标签 ----
      - name: 推送所有标签到 origin（非强制）
        run: |
          # 当有重名标签时，需要添加 --force，不然会报错。
          git push origin --tags
          echo "✅ 标签同步完成"
